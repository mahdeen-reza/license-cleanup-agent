databases:
  - name: license-cleanup-db
    plan: free
    databaseName: license_cleanup
    user: license_cleanup_user

services:
  - type: web
    name: license-cleanup-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: license-cleanup-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: TOKEN_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
